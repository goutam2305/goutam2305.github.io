    <script>
      var savedTheme;
      try { savedTheme = localStorage.getItem('goutam-lab-theme'); } catch (_) {}
      var initialTheme = savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = initialTheme;
      document.documentElement.style.colorScheme = initialTheme;
    </script>
  </head>

    <div id="root"></div>
    <noscript>GOUTAM Lab makes practical 3D tools. Enable JavaScript to explore E-Z Topology and the other projects.</noscript>
